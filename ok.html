<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AromaLux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="ok.css">
</head>
<body>

<header class="navbar">
  <h1>AromaLux </h1>

  <nav>
    <a href="#home">Home</a>
    <a href="#perfumes">Perfumes</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <button id="dark-mode-toggle">🌙</button>
</header>

<section id="home" class="hero">
  <video autoplay muted loop class="hero-video">
    <source src="03.mp4" type="video/mp4">
  </video>

  <div class="hero-content">
    <h2>Wel Come</h2>
    <p>Luxury Fragrance Perfumes</p>

  </div>
</section>

<section id="perfumes" class="products-section">
  <h2>AromaLux Perfumes</h2>
  <div class="products">
    <div class="product-card">
      <img src="01 (4).jpeg">
      <h3>Rose Elegance</h3>
      <p>Floral & Romantic</p>
    </div>
    <div class="product-card">
      <img src="01 (2).jpeg">
      <h3>Ocean Breeze</h3>
      <p>Fresh & Cool</p>
    </div>
    <div class="product-card">
      <img src="01 (3).jpeg">
      <h3>Midnight Oud</h3>
      <p>Bold & Mysterious</p>
    </div>
  </div>
</section>


<section id="about" class="about">
  <h2>About Us</h2>
  <p>
    AromaLux offers luxury perfumes crafted with premium ingredients.
  
  </p>
</section>

<section id="contact" class="contact">
  <h2>Contact Us</h2>

  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message"></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 AromaLux </p>
</footer>

<script src="ok.js"></script>
</body>
</html>
